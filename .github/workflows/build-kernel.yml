name: Build LineageOS 4.14 Kernel with ReSukiSU + eBPF

on:
  workflow_dispatch:        # manual trigger
    inputs:
      clean_ccache:
        description: 'Clean ccache before build?'
        required: false
        default: false
        type: boolean

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Maximize build space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 8192
          temp-reserve-mb: 2048
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y git make bc bison flex libssl-dev build-essential lld wget curl cpio gzip

      - name: Setup toolchains (Clang + GCC)
        run: |
          mkdir -p $HOME/toolchain
          cd $HOME/toolchain
          git clone --depth=1 https://github.com/LineageOS/android_prebuilts_clang_kernel_linux-x86_clang-r416183b -b lineage-20.0 clang
          git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9 -b lineage-19.1 gcc64
          git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9 -b lineage-19.1 gcc32
          echo "$HOME/toolchain/clang/bin" >> $GITHUB_PATH
          echo "$HOME/toolchain/gcc64/bin" >> $GITHUB_PATH
          echo "$HOME/toolchain/gcc32/bin" >> $GITHUB_PATH

      - name: Set environment
        run: |
          echo "CROSS_COMPILE=aarch64-linux-android-" >> $GITHUB_ENV
          echo "CROSS_COMPILE_ARM32=arm-linux-androideabi-" >> $GITHUB_ENV
          echo "CC=clang" >> $GITHUB_ENV
          echo "LD=ld.lld" >> $GITHUB_ENV

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ github.ref_name }}-${{ github.run_id }}
          max-size: 2G

      - name: Clean ccache (if requested)
        if: ${{ github.event.inputs.clean_ccache == 'true' }}
        run: ccache -C

      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          repository: LineageOS/android_kernel_google_msm-4.14
          ref: lineage-23.2
          path: kernel

      - name: Integrate ReSukiSU (built-in SUSFS)
        working-directory: ./kernel
        run: |
          curl -LSs "https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/builtin/kernel/setup.sh" | bash -s builtin

      - name: Configure kernel (enable ReSukiSU, SUSFS, eBPF, disable kprobe hook)
        working-directory: ./kernel
        run: |
          # Prevent long version string
          touch .scmversion
          ./scripts/config --file out/.config -d LOCALVERSION_AUTO 2>/dev/null || true

          make O=out ARCH=arm64 sunfish_defconfig

          # Enable features
          ./scripts/config --file out/.config \
            -e KSU \
            -e KSU_SUSFS \
            -e KSU_MANUAL_HOOK \
            -d KSU_KPROBES_HOOK \
            -e BPF \
            -e BPF_SYSCALL \
            -e BPF_JIT \
            -e BPF_EVENTS \
            -e TRACING \
            -e KALLSYMS \
            -e KALLSYMS_ALL

          make O=out ARCH=arm64 olddefconfig

      - name: Build kernel Image
        working-directory: ./kernel
        run: |
          make O=out ARCH=arm64 CC="ccache clang" LD=ld.lld CLANG_TRIPLE=aarch64-linux-gnu- Image -j$(nproc)

      - name: Verify build output
        id: check_image
        working-directory: ./kernel
        run: |
          if [ -f out/arch/arm64/boot/Image ]; then
            echo "✅ Kernel Image found"
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "❌ Kernel Image missing"
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Upload kernel Image
        if: steps.check_image.outputs.exists == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: kernel-Image
          path: kernel/out/arch/arm64/boot/Image
          retention-days: 7

      # (Optional) If you have a stock boot.img in your repo, you can repack here
      - name: Check for stock boot.img
        id: check_boot
        run: |
          if [ -f "boot.img" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Setup magiskboot
        if: steps.check_boot.outputs.exists == 'true'
        run: |
          wget -q https://github.com/topjohnwu/Magisk/releases/download/v28.1/Magisk-v28.1.apk
          unzip -q Magisk-v28.1.apk -d magisk_extract
          cp magisk_extract/lib/x86_64/libmagiskboot.so magiskboot
          chmod +x magiskboot
          sudo mv magiskboot /usr/local/bin/

      - name: Repack boot image (if boot.img present)
        if: steps.check_boot.outputs.exists == 'true'
        run: |
          cp boot.img boot_work.img
          magiskboot unpack boot_work.img
          mv kernel kernel.orig
          cp kernel/out/arch/arm64/boot/Image kernel
          magiskboot repack boot_work.img new_boot.img
          echo "✅ Repacked new_boot.img"

      - name: Upload repacked boot image
        if: steps.check_boot.outputs.exists == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: new-boot-image
          path: new_boot.img
          retention-days: 7
