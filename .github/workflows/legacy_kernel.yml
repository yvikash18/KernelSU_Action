name: Build Lineage Kernel (Pixel 4a / sunfish) with KernelSU 0.9.5 (Legacy, no eBPF)
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'LineageOS Version'
        required: true
        default: '22.2'
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_HARDLINK: "true"
    steps:
      - name: Maximize build space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 8192
          temp-reserve-mb: 2048
          swap-size-mb: 8192
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'

      - name: Configure Git
        run: |
          git config --global user.name "${{ github.actor }}"
          git config --global user.email "${{ github.actor }}@users.noreply.github.com"

      - name: Checkout this repository
        uses: actions/checkout@v4
        with:
          ref: master
          path: repo

      - name: Checkout kernel code (Pixel 4a / sunfish)
        uses: actions/checkout@v4
        with:
          repository: LineageOS/android_kernel_google_msm-4.14
          ref: lineage-${{ github.event.inputs.version }}
          path: android_kernel_google_msm-4.14

      - name: Checkout AnyKernel3 code
        uses: actions/checkout@v4
        with:
          repository: osm0sis/AnyKernel3
          ref: master
          path: AnyKernel3

      - name: Configure AnyKernel3
        run: |
          cd AnyKernel3
          rm -f anykernel.sh
          cp -f ../repo/anykernel.sh .

      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          max-size: 2G

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi \
            binutils make python3 libssl-dev build-essential bc bison flex unzip \
            ca-certificates xz-utils mkbootimg cpio device-tree-compiler git git-lfs

      - name: Integrate KernelSU 0.9.5 (legacy)
        working-directory: ./android_kernel_google_msm-4.14
        run: |
          set -euo pipefail
          # Download then inspect instead of curl | bash — the runner holds GITHUB_TOKEN,
          # so piping a remote script straight into a shell is a supply-chain risk.
          curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" -o /tmp/ksu_setup.sh
          echo "----- setup.sh (first 40 lines) -----"
          head -n 40 /tmp/ksu_setup.sh
          echo "-------------------------------------"
          bash /tmp/ksu_setup.sh v0.9.5

      - name: Get KernelSU version
        working-directory: ./android_kernel_google_msm-4.14/KernelSU
        run: |
          set -euo pipefail
          VERSION=$(($(git rev-list --count HEAD) + 10200))
          echo "KSU_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "KSU_VERSION=$VERSION"

      - name: Enable KPROBES (legacy KSU hook, no eBPF / no SUSFS)
        working-directory: ./android_kernel_google_msm-4.14
        run: |
          set -euo pipefail
          # sunfish defconfig — verify the name before appending
          CONFIG_FILE=./arch/arm64/configs/sunfish_defconfig
          if [ ! -f "$CONFIG_FILE" ]; then
            echo "::error::sunfish_defconfig not found — available arm64 defconfigs:"
            ls ./arch/arm64/configs/
            exit 1
          fi
          {
            echo "CONFIG_KPROBES=y"
            echo "CONFIG_HAVE_KPROBES=y"
            echo "CONFIG_KPROBE_EVENTS=y"
          } >> "$CONFIG_FILE"

      - name: Download clang
        run: |
          set -euo pipefail
          wget -q https://github.com/llvm/llvm-project/releases/download/llvmorg-14.0.0/clang+llvm-14.0.0-x86_64-linux-gnu-ubuntu-18.04.tar.xz
          tar xf clang+llvm-14.0.0-x86_64-linux-gnu-ubuntu-18.04.tar.xz

      - name: Build kernel with KernelSU
        working-directory: ./android_kernel_google_msm-4.14
        env:
          KERNEL_DEFCONFIG: "sunfish_defconfig"
          ARCH: arm64
          SUBARCH: arm64
        run: |
          set -euo pipefail
          export PATH="$GITHUB_WORKSPACE/clang+llvm-14.0.0-x86_64-linux-gnu-ubuntu-18.04/bin:$PATH"
          make O=out ARCH=arm64 "$KERNEL_DEFCONFIG"
          make -j"$(nproc --all)" O=out ARCH=arm64 \
            CC="ccache clang" \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            LLVM=1

          # msm-4.14 may emit Image.gz-dtb or Image — copy whichever exists
          BOOT=out/arch/arm64/boot
          if [ -f "$BOOT/Image.gz-dtb" ]; then
            cp "$BOOT/Image.gz-dtb" ../AnyKernel3/
          elif [ -f "$BOOT/Image.gz" ]; then
            cp "$BOOT/Image.gz" ../AnyKernel3/
          elif [ -f "$BOOT/Image" ]; then
            cp "$BOOT/Image" ../AnyKernel3/
          else
            echo "::error::No kernel image found in $BOOT"
            ls -lah "$BOOT"
            exit 1
          fi

      - name: Upload AnyKernel3
        uses: actions/upload-artifact@v4
        with:
          name: AnyKernel3_sunfish_Lineage-${{ github.event.inputs.version }}_${{ env.KSU_VERSION }}
          path: "AnyKernel3/*"
